name: Build & Deploy (Web)

# Build the Vite web app and deploy to GitHub Pages.
# Se dispara al pushear un tag v* (ej: v0.3.0).
# También se ejecuta en cada push a main para deploy automático.

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun tsc -b --noEmit

      - name: Build
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: npx vite build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "UI Forger ${{ github.ref_name }} (Web)"
          draft: false
          prerelease: false
          body: |
            ## UI Forger ${{ github.ref_name }} — Web App

            **100% web, sin instalación, sin problemas de GPU.**

            ### Cómo usar
            1. Abre la URL de GitHub Pages (después del primer deploy)
            2. O descarga `uiforger.zip` y abre `index.html` en tu navegador

            ### Requisitos
            - Chrome 86+, Edge 86+, Firefox 78+, Safari 14+
            - 4 GB de RAM mínimo
            - Sin instalación requerida

            ### Offline (PWA)
            La app funciona offline después de la primera visita.
            Los proyectos se guardan en localStorage.

            ### Qué incluye
            - Canvas de diseño con drag & drop, snapping, guías
            - Herramientas: Select, Frame, Text, Rect, Elipse, Línea, Pen
            - Design tokens, componentes, auto-layout, estados
            - Animación con timelines y keyframes
            - Prototipado entre pantallas
            - Export: HTML, PNG, Unity, Unreal, Godot, Lottie, DTCG
            - Game UI: 9-slice, anchoring, conditional visibility
            - Búsqueda global, mini-map, modo outline

            🤖 Generated with Codebuff
          files: |
            dist/**
          make_latest: true
