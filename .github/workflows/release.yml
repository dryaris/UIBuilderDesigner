name: Release (macOS + Windows)

# Compila la app de escritorio en cada sistema y sube los binarios al Release.
# Se dispara al pushear un tag v* (ej: v0.2.2). El Release se crea como
# borrador: revísalo y publícalo desde la página de Releases.
#
# Builds:
#   - macOS: .app + .dmg (universal: Apple Silicon + Intel)
#   - Windows: .msi + .exe (NSIS installer) + .zip (portable, sin instalación)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest # .app + .dmg (universal: Apple Silicon + Intel)
          - windows-latest # .msi + .exe (NSIS) + .zip (portable)
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Rust targets para el binario macOS universal
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build + subir al Release (installers)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "UI Forger ${{ github.ref_name }}"
          releaseBody: |
            ## UI Forger — Editor visual de UI/UX offline

            Editor de diseño 100% offline, sin cuenta y sin backend.
            Multi-destino: HTML/CSS, Unity, Unreal, Godot, Lottie.

            ### Requisitos del sistema

            **Windows:**
            - Windows 10 (1809+) o Windows 11
            - 4 GB de RAM mínimo (8 GB recomendado)
            - 500 MB de espacio en disco
            - WebView2 (se instala automáticamente)

            **macOS:**
            - macOS 10.15 (Catalina) o superior
            - 4 GB de RAM mínimo
            - 500 MB de espacio en disco

            **Web (navegador):**
            - Chrome 86+, Edge 86+, Firefox 78+, Safari 14+
            - 4 GB de RAM mínimo
            - Sin instalación requerida

            ### Archivos

            - **Windows installer**: `.msi` o `.exe` (NSIS) — instala en Program Files
            - **Windows portable**: `.zip` — extrae y ejecuta, sin instalación
            - **macOS**: `.dmg` (universal: Apple Silicon + Intel)

            ### GPUs NVIDIA conocidas

            Algunas GPUs NVIDIA (especialmente RTX 3050/3060 laptop, drivers < 535)
            pueden causar pantalla negra. Soluciones:
            1. Actualizar drivers NVIDIA a 535+
            2. Variable de entorno: `UIFORGER_DISABLE_GPU=1`
            3. Chrome: `--disable-gpu --disable-gpu-compositing`
          releaseDraft: true
          prerelease: false
          args: ${{ runner.os == 'macOS' && '--target universal-apple-darwin' || '' }}

      - name: Crear build portable Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Find the built executable
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "NSIS|installer|setup" -and $_.Directory.Name -eq "msi" } | Select-Object -First 1
          if (-not $exe) {
            # Fallback: find any .exe in the release bundle
            $exe = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "UI Forger.exe" | Select-Object -First 1
          }
          if (-not $exe) {
            # Last fallback: find in nsis output
            $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "installer|setup" } | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Host "Could not find portable exe, listing all exe files:"
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
            # Just grab the NSIS installer exe as the portable
            $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -Filter "*.exe" | Select-Object -First 1
          }
          Write-Host "Using: $($exe.FullName)"

          $version = "${{ github.ref_name }}".Replace("v", "")
          $portableDir = "UI.Forger_${version}_portable"
          New-Item -ItemType Directory -Path $portableDir -Force
          Copy-Item $exe.FullName -Destination "$portableDir\UI Forger.exe"

          # Also copy WebView2 bootstrapper if present
          $bootstrapper = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*webview*" | Select-Object -First 1
          if ($bootstrapper) {
            Copy-Item $bootstrapper.FullName -Destination "$portableDir\" -ErrorAction SilentlyContinue
          }

          Compress-Archive -Path $portableDir -DestinationPath "UI.Forger_${version}_portable.zip"
          Write-Host "Portable zip created: UI.Forger_${version}_portable.zip"

      - name: Subir portable al Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: UI.Forger_*_portable.zip
          draft: true
