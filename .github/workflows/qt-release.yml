name: Build Qt Desktop App

# Manual trigger only — Qt CI is complex and depends on runner state.
# Tag pushes still create a web-only release via the other workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-qt)'
        required: true
        default: 'v1.0.0-qt'

permissions:
  contents: write

jobs:
  # ─── Windows Build ───
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt via aqtinstall
        run: |
          pip install aqtinstall==3.1.1
          aqt install-qt windows desktop 6.6.3 win64_msvc2019_64 -m qtsvg --outputdir ${{ github.workspace }}\Qt

      - name: Build
        shell: cmd
        run: |
          set CMAKE_PREFIX_PATH=%CD%\Qt\6.6.3\msvc2019_64
          cd qt-ui-forger
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=%CD%\..\..\Qt\6.6.3\msvc2019_64
          cmake --build . --config Release

      - name: Package
        shell: cmd
        run: |
          cd qt-ui-forger\build\Release
          %CD%\..\..\..\Qt\6.6.3\msvc2019_64\bin\windeployqt.exe UIForger.exe
          cd ..
          7z a UIForger-Windows-x64.zip Release/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-Windows-x64
          path: qt-ui-forger/build/UIForger-Windows-x64.zip

  # ─── macOS Build ───
  build-macos:
    runs-on: macos-13  # Intel for simpler cross-compilation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt via aqtinstall
        run: |
          pip install aqtinstall==3.1.1
          aqt install-qt mac desktop 6.6.3 clang_64 -m qtsvg --outputdir ${{ github.workspace }}/Qt

      - name: Build
        run: |
          cd qt-ui-forger
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.6.3/clang_64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)

      - name: Bundle
        run: |
          cd qt-ui-forger
          ${{ github.workspace }}/Qt/6.6.3/clang_64/bin/macdeployqt build/UIForger.app -dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-macOS
          path: qt-ui-forger/build/UIForger.dmg

  # ─── Linux Build ───
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglib2.0-dev cmake g++

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt via aqtinstall
        run: |
          pip install aqtinstall==3.1.1
          aqt install-qt linux desktop 6.6.3 gcc_64 -m qtsvg --outputdir ${{ github.workspace }}/Qt

      - name: Build
        run: |
          cd qt-ui-forger
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=${{ github.workspace }}/Qt/6.6.3/gcc_64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Create tar.gz
        run: |
          cd qt-ui-forger/build
          tar czf UIForger-Linux-x64.tar.gz UIForger

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-Linux-x64
          path: qt-ui-forger/build/UIForger-Linux-x64.tar.gz

  # ─── Create GitHub Release ───
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "UI Forger ${{ inputs.tag }} — Desktop (Qt/C++)"
          draft: false
          prerelease: false
          body: |
            ## UI Forger — Qt/C++ Desktop

            **Editor visual de UI para games, nativo en todas las plataformas.**

            ### 📥 Downloads

            | Plataforma | Archivo | Notas |
            |---|---|---|
            | **Windows** | `UIForger-Windows-x64.zip` | Windows 10+, x64 |
            | **macOS** | `UIForger.dmg` | Intel (clang_64) |
            | **Linux** | `UIForger-Linux-x64.tar.gz` | Ubuntu 22.04+, portable |

            ### ⚡ Instalación

            **Windows:** Descomprime `UIForger-Windows-x64.zip` y ejecuta `UIForger.exe`

            **macOS:** Abre `UIForger.dmg` y arrastra a Applications

            **Linux:** `tar xzf UIForger-Linux-x64.tar.gz && ./UIForger`

            ### ✨ Características
            - Canvas QGraphicsView con zoom/pan/drag
            - Inspector de propiedades completo
            - Panel de capas con iconos
            - MiniMap en tiempo real
            - Guardar/cargar proyectos `.canvas`
            - Exportar: HTML, PNG, Unity, Unreal, Godot
            - Dark theme nativo, sin problemas de GPU
            - Autosave cada 30 segundos

            🤖 Generated with Codebuff
          files: |
            artifacts/**/*
          make_latest: true
