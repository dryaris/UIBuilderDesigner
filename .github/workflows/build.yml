name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  QT_VERSION: '6.6.3'

jobs:
  # ─── Windows Build ───
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtsvg'
          cache: true

      - name: Build
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release

      - name: Package
        run: |
          cd build/Release
          windeployqt.exe UIForger.exe
          cd ..
          7z a UIForger-Windows-x64.zip Release/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-Windows-x64
          path: build/UIForger-Windows-x64.zip

  # ─── macOS Build ───
  build-macos:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtsvg'
          cache: true

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Bundle
        run: |
          macdeployqt build/UIForger.app -dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-macOS
          path: build/UIForger.dmg

  # ─── Linux Build ───
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglib2.0-dev cmake g++

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'gcc_64'
          modules: 'qtsvg'
          cache: true

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Package
        run: |
          cd build
          tar czf UIForger-Linux-x64.tar.gz UIForger

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UIForger-Linux-x64
          path: build/UIForger-Linux-x64.tar.gz

  # ─── Create GitHub Release ───
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "UI Forger ${{ inputs.tag || github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## UI Forger — Editor visual de UI para videojuegos

            **Editor nativo de escritorio, Qt/C++. Sin navegador, sin problemas de GPU.**

            ### 📥 Downloads

            | Plataforma | Archivo | Notas |
            |---|---|---|
            | **Windows** | `UIForger-Windows-x64.zip` | Windows 10+, x64, portátil |
            | **macOS** | `UIForger.dmg` | Intel (clang_64) |
            | **Linux** | `UIForger-Linux-x64.tar.gz` | Ubuntu 22.04+, portable |

            ### ⚡ Instalación

            **Windows:** Descomprime `UIForger-Windows-x64.zip` y ejecuta `UIForger.exe`

            **macOS:** Abre `UIForger.dmg` y arrastra a Applications

            **Linux:** `tar xzf UIForger-Linux-x64.tar.gz && ./UIForger`

            ### ✨ Características
            - Canvas QGraphicsView con zoom/pan/drag
            - Inspector de propiedades completo
            - Panel de capas con iconos
            - MiniMap en tiempo real
            - Guardar/cargar proyectos `.canvas`
            - Exportar: HTML, PNG, Unity, Unreal, Godot
            - Dark theme nativo, sin problemas de GPU
            - Autosave cada 30 segundos

            ### 🔧 Requisitos
            - Windows 10+, macOS 12+, Ubuntu 22.04+
            - Qt 6.2+ (para compilar desde código)

            🤖 Generated with Codebuff
          files: |
            artifacts/**/*
          make_latest: true
