[package]
name = "canvas-editor"
version = "0.2.2"
description = "Canvas — Editor visual de UI/UX offline, agnóstico y multi-destino"
authors = ["Canvas"]
edition = "2021"

[lib]
name = "canvas_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
